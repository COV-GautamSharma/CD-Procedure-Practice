name: CD - BUild, Push, Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Login to docker hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v7.3.000000
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add server to know_hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose file to server
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/deploy/docker-compose.new.yml

      - name: Deploy with safe swap and rollback
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd ~/deploy

            echo "Pulling new images defined in staging file . . ."
            docker compose -f docker-compose.new.yml pull

            echo "Backing up current live compose file ( if exists )"
            if [ -f docker-compose.yml ]; then
              cp docker-compose.yml docker-compose.backup.yml
            fi

            echo "Bringing down current running stack . . ."
            if [ -f docker-compose.yml ]; then
              docker compose -f docker-compose.yml down
            fi

            echo "Starting new stack from staging file . . ."
            docker compose -f docker-compose.new.yml up -d --wait

            echo "Running local health check . . ."
            if curl -f --retry 5 --retry-delay 5 http://localhost/api/status; then
              echo "New stack healthy. Promoting staging file to live"
              mv docker-compose.new.yml docker-compose.yml
              docker compose ps
            else
              echo "New stack failed health check. Rolling back . . ."
              docker compose -f docker-compose.new.yml down
              if [ -f docker-compose.backup.yml ]; then
                docker compose -f docker-compose.backup.yml up -d --wait
              fi
              exit 1
            fi
          EOF

      - name: Verify site is reachable via domain
        run: |
          curl -f --retry 5 --retry-delay 5 https://dhamaka.covalience.tech
          curl -f --retry 5 --retry-delay 5 https://dhamaka.covalience.tech/api/status

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
